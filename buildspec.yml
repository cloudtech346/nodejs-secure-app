version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install
      - npm install -g snyk

  build:
    commands:
      - snyk test --json > snyk-report.json || true
      - mkdir -p reports
      - docker run --rm -v "$(pwd):/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://example.com -J /zap/wrk/reports/zap-report.json -r /zap/wrk/reports/zap-report.html || true

artifacts:
  files:
    - snyk-report.json
    - reports/**/*
