version: 0.2

phases:
  install:
    commands:
      - npm install
      - npm install -g snyk
  build:
    commands:
      - snyk test --json > snyk-report.json || true
      - docker run -v $(pwd):/zap/wrk/:rw -t owasp/zap2docker-stable zap-baseline.py -t http://localhost:3000 -r zap-report.html
artifacts:
  files:
    - snyk test
    - zap-report.html
