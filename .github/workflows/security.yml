name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run Snyk SCA + SAST
      - name: Run Snyk SCA + SAST
        uses: snyk/actions/node@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # OWASP ZAP DAST Scan (GitHub Action version, no Docker error)
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.6.0
        with:
          target: 'http://localhost:3000'
          rules: ''
          cmd_options: '-a'

      # Upload Reports
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            snyk-report.json
            zap-report.html
