name: Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Start Node.js application
      - name: Start Node App
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

      # 5. Wait for application to become available
      - name: Wait for Node App
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              echo "Application is running."
              exit 0
            fi

            echo "Waiting for application to start..."
            sleep 2
          done

          echo "Application failed to start."
          cat app.log
          exit 1

      # 6. Snyk dependency vulnerability scan
      - name: Run Snyk SCA + SAST
        uses: snyk/actions/node@master
        with:
          command: test
          args: --json-file-output=snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      # 6b. Snyk Code SAST scan
      - name: Run Snyk Code SAST
        run: npx --yes snyk code test --json-file-output=snyk-code-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 7. OWASP ZAP DAST scan
      - name: OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:3000"
          artifact_name: zap-report

      # 8. Upload reports even if a previous step fails
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            snyk-report.json
            snyk-code-report.json
            zap-report.html
            app.log
          if-no-files-found: warn
          retention-days: 30
