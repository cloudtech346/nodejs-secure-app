apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-secure-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-secure-app
  template:
    metadata:
      labels:
        app: nodejs-secure-app
    spec:
      containers:
        - name: nodejs-secure-app
          image: IMAGE_URI_PLACEHOLDER
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
